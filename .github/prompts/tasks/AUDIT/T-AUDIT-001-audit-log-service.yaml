id: T-AUDIT-001
title: "Append-Only Audit Log Service"
type: feat
scope: "audit"
goal: "Implement core audit service at `src/server/services/audit/audit.ts` and append-only `audit_log` table writes for critical mutations and AI actions."

requirements:
  - "REQ-AUDIT-001"

depends_on:
  - "T-CORE-001"

allowed_paths:
  - src\server\services\audit/

constraints:
  - "Use lightweight JSON metadata"
  - "Keep audit writes non-blocking where safe"
  - "Provide strict typed event payload contracts"
  - "Required for all write mutations"

validation:
  - npm run check

done_when:
  - "Audit write helper supports action_type, entity_type, entity_id, metadata, actor, workspace"
  - "No update/delete paths exposed for audit records"
  - "All audit writes are append-only inserts"
  - "Metadata excludes secrets and raw credentials"
  - "Service reusable across domains"
  - "Requirement satisfied"
  - "Type-safe"
  - "No console errors"
  - "Append-only enforcement present"

commit:
  subject: "feat(audit): implement append-only audit log service"
  body:
    - "Implements T-AUDIT-001"

handoff:
  require_status: true
  require_diff: true
  require_validation_output: true
