id: T-NFR-007
title: "Idempotent Post Metrics Ingestion"
type: feat
scope: "nfr"
goal: "Implement idempotent ingestion handling for post metrics using `(post_id, snapshot_date)` uniqueness and safe upsert semantics."

requirements:
  - "REQ-NFR-005"

depends_on:
  - "T-CONTENT-002"
  - "T-CORE-011"

allowed_paths:
  - src/

constraints:
  - "Use transactional upsert pattern"
  - "Validate incoming values (non-negative metrics, valid rates)"
  - "Support backfill mode without blocking dashboard"
  - "Trigger incremental KPI recompute only for impacted ranges"

validation:
  - npm run check

done_when:
  - "Ingestion checks existing record by post and snapshot date"
  - "Existing rows updated only by newer snapshot policy"
  - "Partial metric updates preserve non-null existing values"
  - "Duplicate batches do not create duplicate metrics"
  - "Ingestion update events are audited"
  - "Requirement satisfied"
  - "Type-safe"
  - "No console errors"
  - "Audit event recorded for ingestion updates"

commit:
  subject: "feat(nfr): implement idempotent post metrics ingestion"
  body:
    - "Implements T-NFR-007"

handoff:
  require_status: true
  require_diff: true
  require_validation_output: true
