id: T-NFR-005
title: "Feature Module Colocation Enforcement"
type: feat
scope: "nfr"
goal: "Enforce route-group-based feature colocation for app routes, feature-local components, server actions, and services."

requirements:
  - "REQ-NFR-004"

depends_on:
  - "T-CORE-003"

allowed_paths:
  - src/app/(main)/dashboard/creator/
  - src/components/
  - src/lib/
  - src/server/actions/
  - src/stores/

constraints:
  - "Preserve shared concerns in `src/components`, `src/lib`, `src/stores`"
  - "Keep imports directional (feature -> shared, not shared -> feature)"
  - "Avoid broad refactors outside scoped domains"
  - "Align with repository instruction constraints"

validation:
  - npm run check

done_when:
  - "Creator domains colocated under `src/app/(main)/dashboard/creator/<domain>`"
  - "Domain local components under `_components` folders"
  - "Server actions grouped by domain in `src/server/actions`"
  - "No cross-domain UI primitive duplication in feature folders"
  - "Project structure documented for contributors"
  - "Requirement satisfied"
  - "Type-safe"
  - "No console errors"
  - "Architecture aligns with spec"

commit:
  subject: "feat(nfr): implement feature module colocation enforcement"
  body:
    - "Implements T-NFR-005"

handoff:
  require_status: true
  require_diff: true
  require_validation_output: true
