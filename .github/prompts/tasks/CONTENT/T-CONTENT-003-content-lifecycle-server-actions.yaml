id: T-CONTENT-003
title: "Content Lifecycle Server Actions"
type: feat
scope: "content"
goal: "Implement server actions for the content lifecycle: create content item (idea/draft), update lifecycle state, update content fields, associate with agent/platform, publish (create post record), archive. Each action validates session, checks RBAC, validates input with zod, and logs audit events. Reference: specs/03-architecture.md §3.2, specs/10-permissions-matrix.md §4.3."

requirements:
  - "REQ-CONTENT-001"
  - "REQ-CONTENT-004"

depends_on:
  - "T-CONTENT-001"
  - "T-COLLAB-002"
  - "T-AUDIT-007"

allowed_paths:
  - src/

constraints:
  - "Permission: Creator + Editor can create/edit/publish/archive content (specs/10-permissions-matrix.md §4.3)"
  - "State transitions must be validated server-side"
  - "Zod schemas for all inputs"
  - "Content item → post is a one-time promotion (publish)"
  - "external_post_id set during publish or ingestion"

validation:
  - npm run check

done_when:
  - "`createContentItem` action: Creator/Editor role, creates with initial lifecycle state"
  - "`updateContentItem` action: update title, objective, state transitions"
  - "`publishContent` action: creates post record, transitions to published"
  - "`archiveContent` action: Creator/Editor role"
  - "Agent and platform assignment on create/update"
  - "All mutations log audit events (via T-AUDIT-007)"
  - "Lifecycle state machine enforced (no skipping states)"
  - "Requirement satisfied: REQ-CONTENT-001, REQ-CONTENT-004"
  - "Type-safe"
  - "No console errors"
  - "Server-side permission enforcement present"
  - "Audit event recorded"

commit:
  subject: "feat(content): implement content lifecycle server actions"
  body:
    - "Implements T-CONTENT-003"

handoff:
  require_status: true
  require_diff: true
  require_validation_output: true
