id: T-CONTENT-006
title: "Idea/Theme Clustering Service & UI"
type: feat
scope: "content"
goal: "Implement post clustering by idea/theme groups. Create an idea_clusters table, a service that assigns content items to clusters (via embedding similarity or manual tagging), and a UI to display cluster memberships. Cluster tags shown in content library and bubble chart (T-INSIGHT-006). Reference: specs/01-product-spec.md §5.3, specs/05-data-model.md §6.4 (idea_cluster_id)."

requirements:
  - "REQ-CONTENT-005"

depends_on:
  - "T-CONTENT-001"
  - "T-CONTENT-002"

allowed_paths:
  - src/

constraints:
  - "post_analysis.idea_cluster_id links to clusters"
  - "AI-assisted clustering is Phase 1.5 (manual MVP)"
  - "Clustering feeds into compounding score (specs/06-kpi-definitions.md §3.1)"
  - "Saturation index uses cluster density (specs/06-kpi-definitions.md §3.2)"

validation:
  - npm run check

done_when:
  - "`idea_clusters` table: id, agent_id, label, description, created_at"
  - "Content items can be assigned to clusters (manual or AI-assisted)"
  - "Cluster tag displayed in content library table (T-CONTENT-004)"
  - "Cluster management UI: create, rename, delete clusters"
  - "Assign/reassign posts to clusters"
  - "Server action for cluster operations"
  - "Requirement satisfied: REQ-CONTENT-005"
  - "Type-safe"
  - "No console errors"
  - "Server-side permission enforcement present"

commit:
  subject: "feat(content): implement ideatheme clustering service ui"
  body:
    - "Implements T-CONTENT-006"

handoff:
  require_status: true
  require_diff: true
  require_validation_output: true
