type: feat
scope: "ai"
goal: "Define contracts/schemas for AI repurposing suggestions across formats/platforms."

requirements:
  - "REQ-AI-003"

depends_on:
  - "T-AI-001"

allowed_paths:
  - src/

constraints:
  - "Keep output deterministic with explicit fields"
  - "Include trace metadata typing"
