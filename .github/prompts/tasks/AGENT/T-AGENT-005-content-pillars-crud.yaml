id: T-AGENT-005
title: "Content Pillars Definition & CRUD"
type: feat
scope: "agent"
goal: "Enable defining, editing, and deleting content pillars per agent. Content pillars define the strategic topic clusters that the agent should focus on. Used downstream for narrative alignment scoring. CRUD operations via server actions with Creator/Editor permission. Reference: specs/01-product-spec.md §5.2,  specs/06-kpi-definitions.md §2.4 (pillar embeddings input)."

requirements:
  - "REQ-AGENT-008"

depends_on:
  - "T-AGENT-001"
  - "T-AGENT-002"

allowed_paths:
  - src/

constraints:
  - "Stored in `agent_content_pillars` table from T-AGENT-001"
  - "Pillar embeddings computed lazily when alignment scoring runs"
  - "Zod validation on inputs"
  - "Audit log for pillar changes"

validation:
  - npm run check

done_when:
  - "Pillar CRUD server actions (create, update, delete, list) for a given agent"
  - "Pillar UI within agent detail (Identity or Overview tab)"
  - "Each pillar: name, description"
  - "Minimum 1 pillar recommended per agent"
  - "Pillar data used as input for alignment scoring (T-AI-012)"
  - "Permission: Creator + Editor can manage pillars"
  - "Requirement satisfied: REQ-AGENT-008"
  - "Type-safe"
  - "No console errors"
  - "Server-side permission enforcement present"
  - "Audit event recorded"

commit:
  subject: "feat(agent): implement content pillars definition crud"
  body:
    - "Implements T-AGENT-005"

handoff:
  require_status: true
  require_diff: true
  require_validation_output: true
