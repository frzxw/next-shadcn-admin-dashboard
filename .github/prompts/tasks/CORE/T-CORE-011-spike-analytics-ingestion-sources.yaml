id: T-CORE-011
title: "SPIKE — Analytics Ingestion Source Strategy"
type: feat
scope: "core"
goal: "Research and decide on analytics ingestion strategy for MVP. Determine which sources power retention and engagement metrics: manual entry, CSV upload, and/or API connectors. Document the normalized metrics schema mapping, freshness targets, and connector architecture. Reference: specs/18-analytics-ingestion-spec.md, specs/02-requirements.md OQ-002."

requirements:
  - "None (resolves OQ-002)"

depends_on: []

allowed_paths:
  - src/

constraints:
  - "MVP likely manual + CSV (specs/18-analytics-ingestion-spec.md §2)"
  - "Idempotency rules must be defined (specs/18-analytics-ingestion-spec.md §5)"
  - "Data freshness: immediate for manual, daily for API (specs/18-analytics-ingestion-spec.md §10)"

validation:
  - npm run check

done_when:
  - "Decision document produced with: MVP ingestion sources, normalization rules, freshness targets"
  - "Manual entry + CSV upload confirmed for MVP (or alternative)"
  - "Normalized metrics schema reviewed against specs/18-analytics-ingestion-spec.md §4"
  - "Platform connector architecture sketched for Phase 2"
  - "Decision unblocks T-NFR-007 and T-INSIGHT-001"
  - "Decision document committed"
  - "Ingestion sources identified"
  - "No implementation required — research only"

commit:
  subject: "feat(core): research spike analytics ingestion source strategy"
  body:
    - "Implements T-CORE-011"

handoff:
  require_status: true
  require_diff: true
  require_validation_output: true
