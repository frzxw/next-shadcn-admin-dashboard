id: T-CORE-006
title: "Home Dashboard Bento Layout"
type: feat
scope: "core"
goal: "Build the Home dashboard page using bento grid layout. Implement the card-based layout structure: Row 1 (KPI strip full width), Row 2 (Strategic Copilot 6-col + Alerts 6-col), Row 3 (Performance Matrix 8-col + Agent Snapshot 4-col), Row 4 (Audience Funnel 6-col + Idea Clusters 6-col). Each card is a composable component accepting loading/error/empty states. Reference: specs/04-information-architecture.md §3.2, specs/16-design-system-alignment.md §4.2."

requirements:
  - "REQ-CORE-001"

depends_on:
  - "T-CORE-003"
  - "T-CORE-005"
  - "T-NFR-001"

allowed_paths:
  - src/

constraints:
  - "Use server components for the shell; hydrate only interactive widgets"
  - "Cards must be composable React components (specs/04-information-architecture.md §10)"
  - "Consistent padding: 24px desktop / 16px mobile (specs/16-design-system-alignment.md §4.2)"
  - "No nested cards inside cards"
  - "Shadow level from system tokens only"
  - "Data integration deferred to KPI strip (T-CORE-007), matrix (T-CORE-008), alerts (T-CORE-009)"

validation:
  - npm run check

done_when:
  - "Home page renders bento grid with 4 rows"
  - "Cards use standardized Card component from shared UI"
  - "Each card has title, optional subtitle, body, and optional footer actions"
  - "No more than 6 bento cards per viewport height"
  - "Cards accept loading, error, and empty state props"
  - "12-col desktop / 8-col tablet / 4-col mobile stacking"
  - "Dashboard loads with skeleton placeholders while data fetches"
  - "REQ-CORE-001 structurally satisfied (display surface ready)"
  - "Requirement satisfied: REQ-CORE-001"
  - "Type-safe"
  - "No console errors"
  - "UI follows shared UI primitives rules"
  - "Responsive layout verified"

commit:
  subject: "feat(core): implement home dashboard bento layout"
  body:
    - "Implements T-CORE-006"

handoff:
  require_status: true
  require_diff: true
  require_validation_output: true
