id: T-CORE-007
title: "KPI Strip Shared Component"
type: feat
scope: "core"
goal: "Build a reusable KPI strip component that displays key metrics: Growth Rate, Avg Retention, Returning Viewer %, Narrative Alignment, Persona Integrity, Audience Quality. Each KPI block shows large numeric value, trend arrow (up/down/neutral), percentage delta, and time range indicator. The strip is shared between Home and Insights pages. Reference: specs/06-kpi-definitions.md §2, specs/16-design-system-alignment.md §8, specs/04-information-architecture.md §3.2 Row 1."

requirements:
  - "REQ-CORE-001"
  - "REQ-INSIGHT-001"

depends_on:
  - "T-CORE-006"
  - "T-INSIGHT-001"

allowed_paths:
  - src/app/(main)/dashboard/creator/_components/

constraints:
  - "KPI number font size 28–36px (specs/16-design-system-alignment.md §5.1)"
  - "Green for positive, red for critical, yellow for warning (specs/16-design-system-alignment.md §6.1)"
  - "No decorative icons unrelated to metric"
  - "Suppress long-term KPIs for agents < 7 days old (specs/06-kpi-definitions.md §9)"
  - "Shared component placed in `src/app/(main)/dashboard/creator/_components/`"

validation:
  - npm run check

done_when:
  - "KPI strip renders 6 core metrics"
  - "Each KPI block: large number, trend arrow, delta %, time range"
  - "No more than 3 KPIs per card (specs/16-design-system-alignment.md §8)"
  - "Handles loading, \"Low Data\", and empty states"
  - "Never displays NaN (specs/06-kpi-definitions.md §9)"
  - "Collapses into swipeable cards on mobile (specs/04-information-architecture.md §6)"
  - "Data sourced from agent_kpi_snapshots via server component"
  - "Requirement satisfied: REQ-CORE-001, REQ-INSIGHT-001"
  - "Type-safe KPI data interface"
  - "No console errors"
  - "UI follows shared UI primitives rules"
  - "Responsive swipeable behavior on mobile"

commit:
  subject: "feat(core): implement kpi strip shared component"
  body:
    - "Implements T-CORE-007"

handoff:
  require_status: true
  require_diff: true
  require_validation_output: true
