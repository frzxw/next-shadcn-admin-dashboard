id: T-SEC-002
title: "AI Request Rate Limiting"
type: feat
scope: "sec"
goal: "Implement per-workspace rate limits for AI generation/scoring calls to prevent abuse and enforce fair usage."

requirements:
  - "REQ-NFR-003"

depends_on:
  - "T-AI-001"
  - "T-CORE-002"

allowed_paths:
  - src/

constraints:
  - "Apply at server action or orchestrator boundary"
  - "Keep counters in fast store (redis/db cache) as available"
  - "Do not expose internal limit internals in client errors"
  - "Integrate with monetization gating rules where needed"

validation:
  - npm run check

done_when:
  - "Workspace-level generation and scoring limits enforced"
  - "Burst + sustained limit strategy defined"
  - "Exceeded limit returns safe error and retry timing"
  - "Limits configurable by plan tier"
  - "Rate-limit events logged"
  - "Requirement satisfied"
  - "Type-safe"
  - "No console errors"
  - "Server-side enforcement present"
  - "Audit/security log emitted for throttle events"

commit:
  subject: "feat(sec): implement ai request rate limiting"
  body:
    - "Implements T-SEC-002"

handoff:
  require_status: true
  require_diff: true
  require_validation_output: true
