id: T-INSIGHT-005
title: "Audience Funnel Visualization"
type: feat
scope: "insight"
goal: "Build the audience funnel visualization showing the conversion path: Impressions → Views → Engagement → Follows → Returning Viewers. Each stage displays volume and conversion percentage. Funnel narrows proportionally. Reference: specs/01-product-spec.md §5.5, specs/04-information-architecture.md §3.2 Row 4."

requirements:
  - "REQ-INSIGHT-004"

depends_on:
  - "T-INSIGHT-002"
  - "T-AUD-001"

allowed_paths:
  - src/

constraints:
  - "Data aggregated from post_metrics"
  - "Pre-computed server-side"
  - "6-col card in insights bento"
  - "Uses semantic color tokens"

validation:
  - npm run check

done_when:
  - "Funnel chart with stages: Impressions → Views → Engagement → Follows → Returning"
  - "Each stage: absolute number + conversion % from previous stage"
  - "Proportional narrowing"
  - "Hover tooltips"
  - "Date range filtering"
  - "Agent-scoped data"
  - "Loading/empty states"
  - "Requirement satisfied: REQ-INSIGHT-004"
  - "Type-safe"
  - "No console errors"
  - "Chart accessible via table fallback"

commit:
  subject: "feat(insight): implement audience funnel visualization"
  body:
    - "Implements T-INSIGHT-005"

handoff:
  require_status: true
  require_diff: true
  require_validation_output: true
