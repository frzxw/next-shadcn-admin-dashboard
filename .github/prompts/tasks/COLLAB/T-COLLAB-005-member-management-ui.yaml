id: T-COLLAB-005
title: "Member Management Settings UI"
type: feat
scope: "collab"
goal: "Build settings UI for workspace members: list members, roles, invite flow, role changes, and remove action. Ensure role-gated visibility and safe confirmations."

requirements:
  - "REQ-COLLAB-001"

depends_on:
  - "T-COLLAB-004"
  - "T-CORE-003"

allowed_paths:
  - src/

constraints:
  - "Use shared table, dialog, form, select primitives"
  - "Confirmations via standard alert-dialog component"
  - "No custom colors or ad-hoc styling"
  - "Server actions from T-COLLAB-004 only"

validation:
  - npm run check

done_when:
  - "Members table shows name, email, role, joined date"
  - "Invite member form available for Creator"
  - "Role select + update action with confirmation"
  - "Remove member action with destructive confirmation"
  - "Non-Creator roles see read-only view or no access"
  - "Loading and error states included"
  - "Requirement satisfied"
  - "Type-safe"
  - "No console errors"
  - "UI follows shared UI primitives rules"

commit:
  subject: "feat(collab): implement member management settings ui"
  body:
    - "Implements T-COLLAB-005"

handoff:
  require_status: true
  require_diff: true
  require_validation_output: true
