id: T-EXP-004
title: "Experiment Confidence Score Computation"
type: feat
scope: "exp"
goal: "Implement the confidence score computation service for experiments. Uses the V1 simplified formula: confidence_score = abs(variantA_perf - variantB_perf) / pooled_variance. Enforces minimum sample rules. Produces confidence bands: Low (<60%), Medium (60–80%), High (>80%). Reference: specs/09-experimentation-framework.md §6, specs/06-kpi-definitions.md §4.2."

requirements:
  - "REQ-EXP-003"

depends_on:
  - "T-EXP-001"
  - "T-CONTENT-002"

allowed_paths:
  - src/

constraints:
  - "Pooled_variance = combined variance across variants"
  - "Performance data from post_metrics via experiment_variants"
  - "Computation triggered on metrics update or manual request"
  - "Statistical threshold configurable per plan tier (OQ-006)"

validation:
  - npm run check

done_when:
  - "Confidence score computed per experiment when variants have sufficient data"
  - "Performance index normalized: log(views + 1) / log(median_views + 1)"
  - "Minimum sample rule enforced (configurable threshold)"
  - "Confidence bands displayed: Low, Medium, High"
  - "Cannot complete experiment unless minimum sample met"
  - "Score stored in experiment_results.confidence_score"
  - "Requirement satisfied: REQ-EXP-003"
  - "Type-safe"
  - "Formula matches spec"
  - "Edge cases handled (insufficient data, single variant)"

commit:
  subject: "feat(exp): implement experiment confidence score computation"
  body:
    - "Implements T-EXP-004"

handoff:
  require_status: true
  require_diff: true
  require_validation_output: true
